<!DOCTYPE html>
<html>

<head>

<title>Signup</title>

<style>

body{

margin:0;
font-family:Segoe UI;
display:flex;
height:100vh;

}


/* LEFT PANEL */

.left{

width:50%;

background:linear-gradient(120deg,#111,#222);

color:white;

padding:100px;

animation:slideLeft 1s ease;

}


@keyframes slideLeft{

from{

opacity:0;
transform:translateX(-100px);

}

to{

opacity:1;
transform:translateX(0);

}

}


.left h1{

font-size:42px;
line-height:1.3;

}


.left p{

margin-top:25px;

font-size:18px;

}


/* RIGHT PANEL */

.right{

width:50%;

background:#f2f2f2;

padding:60px;

animation:slideRight 1s ease;

overflow-y:auto;

}


@keyframes slideRight{

from{

opacity:0;
transform:translateX(100px);

}

to{

opacity:1;
transform:translateX(0);

}

}


h2{

margin-bottom:20px;

}


/* INPUT STYLE */

input, select{

width:100%;

padding:14px;

margin-top:16px;

border-radius:6px;

border:1px solid #ccc;

font-size:15px;

transition:.3s;

}


input:focus,
select:focus{

outline:none;

border-color:#ff3b3b;

box-shadow:0px 0px 5px rgba(255,59,59,0.3);

}


/* BUTTON */

button{

width:100%;

margin-top:30px;

padding:15px;

background:#ff3b3b;

color:white;

border:none;

font-size:16px;

cursor:pointer;

transition:.3s;

}


button:hover{

background:#cc0000;

transform:scale(1.03);

box-shadow:0px 4px 15px rgba(0,0,0,0.25);

}


/* ERROR MESSAGE */

.error{

color:red;

margin-top:10px;

}

</style>

</head>


<body>


<div class="left">

<h1>

Effortlessly manage, track, and optimize your inventory in one place.

</h1>

<p>

✔ 20–30% reduction in inventory costs

</p>

<p>

✔ 30–50% of manual tasks automated

</p>

</div>



<div class="right">

<h2>Let's get started</h2>


{% if error %}

<p class="error">{{ error }}</p>

{% endif %}


<form method="POST" enctype="multipart/form-data">

{% csrf_token %}


<input name="company"
placeholder="Company Name"
required>


<input name="email"
type="email"
placeholder="Email Address"
required>


<input name="phone"
placeholder="Phone number"
required>


<input name="password"
type="password"
placeholder="Password"
required>


<input name="country"
value="India"
readonly>


<select name="state"
required>

<option value="">Select State</option>

<option>Andhra Pradesh</option>
<option>Arunachal Pradesh</option>
<option>Assam</option>
<option>Bihar</option>
<option>Chhattisgarh</option>
<option>Goa</option>
<option>Gujarat</option>
<option>Haryana</option>
<option>Himachal Pradesh</option>
<option>Jharkhand</option>
<option>Karnataka</option>
<option>Kerala</option>
<option>Madhya Pradesh</option>
<option>Maharashtra</option>
<option>Manipur</option>
<option>Meghalaya</option>
<option>Mizoram</option>
<option>Nagaland</option>
<option>Odisha</option>
<option>Punjab</option>
<option>Rajasthan</option>
<option>Sikkim</option>
<option>Tamil Nadu</option>
<option>Telangana</option>
<option>Tripura</option>
<option>Uttar Pradesh</option>
<option>Uttarakhand</option>
<option>West Bengal</option>

<option>Andaman and Nicobar Islands</option>
<option>Chandigarh</option>
<option>Dadra and Nagar Haveli and Daman and Diu</option>
<option>Delhi</option>
<option>Jammu and Kashmir</option>
<option>Ladakh</option>
<option>Lakshadweep</option>
<option>Puducherry</option>

</select>


<label style="margin-top:18px; display:block;">

Upload Profile (JPG only)

</label>


<input type="file"
name="profile"
accept=".jpg"
required>


<button>

Create your account

</button>


</form>

</div>


</body>

</html>
