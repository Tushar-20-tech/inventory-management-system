{% load static %}
<!DOCTYPE html>
<html>

<head>

<title>Edit Product</title>

<style>

body{

margin:0;
font-family:Segoe UI;
background:#eef2f7;

display:flex;
justify-content:center;
align-items:center;

height:100vh;

animation:fadeIn .6s ease;

}


@keyframes fadeIn{

from{opacity:0;}
to{opacity:1;}

}


/* CARD */

.card{

background:white;

padding:40px;

border-radius:16px;

box-shadow:0px 12px 35px rgba(0,0,0,.15);

width:500px;

animation:slideUp .6s ease;

}


@keyframes slideUp{

from{

opacity:0;
transform:translateY(50px);

}

to{

opacity:1;
transform:translateY(0);

}

}


h2{

margin-bottom:25px;

color:#1e3350;

}


/* INPUTS */

input, select{

width:100%;

padding:12px;

margin-bottom:18px;

border-radius:6px;

border:1px solid #ccc;

font-size:15px;

transition:.3s;

}


input:focus,
select:focus{

outline:none;

border-color:#1e3350;

}


/* BUTTONS AREA */

.buttons{

display:flex;

gap:15px;

margin-top:15px;

}


/* SAVE BUTTON */

.save-btn{

flex:1;

background:#1e3350;

color:white;

border:none;

padding:14px;

border-radius:8px;

cursor:pointer;

transition:.3s;

}


.save-btn:hover{

background:#2c4a73;

transform:scale(1.04);

}


/* CANCEL BUTTON */

.cancel-btn{

flex:1;

background:#e53935;

color:white;

border:none;

padding:14px;

border-radius:8px;

cursor:pointer;

transition:.3s;

}


.cancel-btn:hover{

background:#b71c1c;

transform:scale(1.04);

}

</style>

</head>


<body>


<div class="card">

<h2>Edit Product</h2>

<form method="POST">

{% csrf_token %}


<input
name="name"
value="{{ product.name }}"
required>


<select name="category" required>

<option>{{ product.category }}</option>

<option>Electronics</option>
<option>Stationery</option>
<option>Furniture</option>
<option>Groceries</option>
<option>Clothing</option>
<option>Accessories</option>
<option>Hardware</option>
<option>Software</option>
<option>Medical Supplies</option>
<option>Office Items</option>

</select>


<input
name="quantity"
type="number"
value="{{ product.quantity }}"
required>


<input
name="price"
type="number"
step="0.01"
value="{{ product.price }}"
required>


<input
name="supplier"
value="{{ product.supplier }}">


<div class="buttons">

<button class="save-btn">

Save Changes

</button>


<button type="button"class="cancel-btn"onclick="window.location.href='{% url 'products' %}'">

Cancel

</button>

</div>


</form>


</div>


</body>

</html>
